name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q

  # The drill is the project's central claim, so it runs for real in CI on all
  # three platforms. It needs the mlflow SDK, hence a separate job: the library
  # itself must stay stdlib-only.
  drill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with drill extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,drill]"
      - name: Rehearse backup and restore
        run: python -m mlflow_vault.cli drill --workdir _drill --runs 3 --require-mlflow
      - name: Verify the package the drill produced
        run: python -m mlflow_vault.cli verify _drill/backup
      - name: Redact and re-verify
        run: |
          python -m mlflow_vault.cli redact _drill/backup --out _drill/shared
          python -m mlflow_vault.cli verify _drill/shared
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drill-${{ matrix.os }}
          path: |
            _drill/report.json
            _drill/verify-clean.json
            _drill/tamper.json
            _drill/readback.json
            _drill/negative-control.txt
          if-no-files-found: warn

  # A store with a Chinese path is not exotic, and on Windows it is where encoding
  # bugs surface. This job is cheap and has caught real regressions.
  encoding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: CLI survives a CJK path and CJK output
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "cp936"
          python -m pytest tests/test_cli.py -q -k "chinese"
